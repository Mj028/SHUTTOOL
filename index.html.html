<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08264d">
<title>SHUTLER — Campus Change Credit</title>

<style>
:root{
  --navy:#08264d;
  --navy2:#0d3568;
  --blue:#1769ff;
  --blue2:#0d4fd8;
  --sky:#eaf3ff;
  --green:#13a05a;
  --green2:#0d7e45;
  --mint:#e9f9f0;
  --amber:#d99012;
  --amberbg:#fff6df;
  --red:#d64545;
  --redbg:#fff0f0;
  --bg:#f5f8fc;
  --card:#fff;
  --text:#10233f;
  --muted:#6b7b91;
  --line:#dfe7f1;
  --shadow:0 18px 45px rgba(15,39,70,.08);
  --radius:20px;

  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.shell{
  width:min(1180px,92%);
  margin:0 auto;
}

.top{
  height:76px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4%;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none;
  color:var(--navy);
  border:0;
  background:transparent;
  padding:0;
}

.brand-mark{
  width:42px;
  height:42px;
  display:block;
}

.brand-name{
  font-weight:950;
  letter-spacing:.08em;
  font-size:20px;
  line-height:1;
}

.brand-tag{
  font-size:9px;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:800;
  margin-top:4px;
  display:block;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.role-pill{
  padding:8px 12px;
  border-radius:999px;
  background:#eef4fb;
  color:#355170;
  font-size:12px;
  font-weight:850;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--navy);
  color:#fff;
  font-weight:900;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:850;
  transition:.18s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn.primary{
  background:var(--navy);
  color:#fff;
}

.btn.blue{
  background:var(--blue);
  color:#fff;
}

.btn.green{
  background:var(--green);
  color:#fff;
}

.btn.soft{
  background:#edf4ff;
  color:#1551b4;
}

.btn.outline{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text);
}

.btn.red{
  background:var(--redbg);
  color:var(--red);
}

.btn.ghost{
  background:transparent;
  color:var(--muted);
}

.hero{
  margin:28px 0 22px;
  border-radius:28px;
  overflow:hidden;
  position:relative;
  background:radial-gradient(
    circle at 85% 15%,
    #2a80e8 0,
    #124c91 32%,
    #071f3d 75%
  );
  color:#fff;
  min-height:450px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  padding:58px 52px;
  box-shadow:0 24px 60px rgba(6,31,61,.18);
}

.hero:after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.1);
  right:-130px;
  bottom:-220px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:11px;
  font-weight:950;
  color:#5c91dc;
}

.hero .eyebrow{
  color:#a8d0ff;
}

.hero h1{
  font-size:clamp(42px,6vw,72px);
  line-height:.92;
  letter-spacing:-.04em;
  margin:12px 0 18px;
  max-width:650px;
}

.hero h1 span{
  color:#77b0ff;
}

.hero p{
  max-width:650px;
  color:#dbe9fa;
  line-height:1.7;
  font-size:16px;
}

.hero-actions{
  display:flex;
  gap:11px;
  flex-wrap:wrap;
  margin-top:26px;
}

.hero-visual{
  position:relative;
  min-height:320px;
  display:grid;
  place-items:center;
}

.bus-scene{
  width:min(470px,100%);
  height:300px;
  position:relative;
}

.bus{
  position:absolute;
  left:40px;
  bottom:35px;
  width:340px;
  height:145px;
  border-radius:28px 35px 20px 20px;
  background:linear-gradient(
    180deg,
    #eaf4ff 0 35%,
    #1680ed 36% 72%,
    #0c4c9b 73%
  );
  box-shadow:0 25px 40px rgba(0,0,0,.22);
  border:4px solid rgba(255,255,255,.3);
}

.bus:before{
  content:"";
  position:absolute;
  left:22px;
  top:16px;
  width:292px;
  height:50px;
  border-radius:15px;
  background:#173653;
  box-shadow:inset 0 0 0 3px #2f8ef0;
}

.bus:after{
  content:"SHUTLER";
  position:absolute;
  left:46px;
  top:29px;
  color:#fff;
  font-size:13px;
  font-weight:950;
  letter-spacing:.18em;
}

.bus-window{
  position:absolute;
  right:17px;
  top:16px;
  width:48px;
  height:50px;
  border-radius:12px;
  background:#cbe4ff;
  border:3px solid #173653;
}

.wheel{
  position:absolute;
  bottom:-24px;
  width:53px;
  height:53px;
  border-radius:50%;
  background:#15253a;
  border:9px solid #fff;
  box-shadow:0 2px 0 #07182c;
}

.wheel.one{
  left:53px;
}

.wheel.two{
  right:50px;
}

.coin{
  position:absolute;
  right:26px;
  top:35px;
  width:92px;
  height:92px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(
    145deg,
    #22c978,
    #0a8c4b
  );
  border:7px solid rgba(255,255,255,.8);
  box-shadow:0 16px 35px rgba(0,0,0,.25);
  font-size:32px;
  font-weight:950;
  color:#fff;
  z-index:3;
}

.qr-card{
  position:absolute;
  right:4px;
  bottom:18px;
  width:145px;
  height:170px;
  background:#fff;
  border-radius:20px;
  padding:13px;
  box-shadow:0 24px 50px rgba(0,0,0,.25);
  transform:rotate(4deg);
  z-index:4;
  color:var(--navy);
}

.qr-card .fake-qr{
  height:105px;
  border:5px solid #111;
  border-radius:9px;
  background:repeating-linear-gradient(
    45deg,
    #111 0 4px,
    #fff 4px 8px
  );
  position:relative;
  overflow:hidden;
}

.qr-card .fake-qr:after{
  content:"";
  position:absolute;
  inset:12px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #111 7px 11px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 8px,
      #111 8px 12px
    );
  mix-blend-mode:multiply;
}

.qr-label{
  font-size:9px;
  font-weight:900;
  text-align:center;
  margin-top:8px;
  letter-spacing:.08em;
}

.feature-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:7px;
  margin-bottom:28px;
}

.feature-step{
  padding:18px 17px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  border-right:1px solid var(--line);
}

.feature-step:last-child{
  border-right:0;
}

.step-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:14px;
  background:#edf4ff;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-weight:950;
  font-size:17px;
}

.feature-step strong{
  display:block;
  font-size:13px;
}

.feature-step span{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
  margin-top:4px;
}

.card,
.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card{
  padding:24px;
  margin:16px 0;
}

.card h2,
.card h3{
  margin:0 0 7px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin:30px 0 18px;
}

.page-head h2{
  font-size:32px;
  letter-spacing:-.03em;
  margin:5px 0;
}

.page-head p{
  max-width:650px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.centered{
  text-align:center;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  padding:19px;
  position:relative;
  overflow:hidden;
}

.stat:after{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  right:-24px;
  top:-24px;
  background:#eef5ff;
}

.stat .label{
  font-size:11px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.stat .value{
  font-size:27px;
  font-weight:950;
  margin-top:9px;
  position:relative;
  z-index:1;
}

.feature-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin:18px 0;
}

.feature{
  padding:19px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  text-align:left;
  transition:.18s ease;
  min-height:126px;
}

.feature:hover{
  border-color:#9dbef0;
  box-shadow:0 10px 25px rgba(23,105,255,.08);
  transform:translateY(-2px);
}

.feature .icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#edf4ff;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-weight:950;
  margin-bottom:12px;
}

.feature strong{
  display:block;
}

.feature span{
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.grid.two{
  grid-template-columns:1.1fr .9fr;
}

.list{
  display:grid;
  gap:9px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}

.row-main{
  min-width:0;
}

.row-title{
  font-weight:850;
}

.row-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.badge.pending{
  background:var(--amberbg);
  color:var(--amber);
}

.badge.approved,
.badge.confirmed,
.badge.resolved{
  background:var(--mint);
  color:var(--green2);
}

.badge.rejected,
.badge.open{
  background:var(--redbg);
  color:var(--red);
}

.badge.claimed{
  background:#eef3fa;
  color:#5d6b7e;
}

.money-green{
  color:var(--green2);
}

.money-red{
  color:var(--red);
}

.scanner{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
}

.scanner-box{
  min-height:330px;
  border:1px dashed #b7c5d8;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:#f9fbfe;
  overflow:hidden;
}

.driver-card{
  border:1px solid #cfe7d8;
  background:#f6fff9;
  border-radius:15px;
  padding:17px;
}

.credit-card{
  background:linear-gradient(
    135deg,
    #08264d,
    #155fb9
  );
  color:#fff;
  border:0;
}

.credit-card .muted{
  color:#d3e5fa;
}

.credit{
  font-size:44px;
  font-weight:950;
  margin:7px 0;
}

.timeline{
  display:flex;
  gap:7px;
  margin:18px 0 8px;
}

.timeline .step{
  height:6px;
  flex:1;
  border-radius:99px;
  background:#d9e2ed;
}

.timeline .step.done{
  background:var(--green);
}

.timeline-labels{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
}

form{
  display:grid;
  gap:13px;
}

label{
  font-size:12px;
  font-weight:850;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd6e3;
  border-radius:12px;
  padding:12px;
  background:#fff;
  outline:0;
  color:var(--text);
}

input:focus,
select:focus,
textarea:focus{
  border-color:#6d9fec;
  box-shadow:0 0 0 3px #e8f1ff;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.auth-wrap{
  min-height:calc(100vh - 76px);
  display:grid;
  place-items:center;
  padding:50px 0;
}

.auth{
  width:min(510px,100%);
  padding:30px;
}

.role-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:6px 0 13px;
}

.role-card{
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  cursor:pointer;
}

.role-card.selected{
  border:2px solid var(--blue);
  background:#f1f6ff;
}

.role-card input{
  display:none;
}

.role-card strong{
  display:block;
}

.role-card span{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.helper,
.notice,
.danger-note{
  padding:13px;
  border-radius:12px;
  font-size:11px;
  line-height:1.55;
}

.helper{
  background:#f7f9fc;
  border:1px dashed #cbd5e1;
  color:var(--muted);
}

.notice{
  background:#eef5ff;
  color:#214e90;
}

.danger-note{
  background:var(--redbg);
  color:#8d3030;
}

.wallet-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
}

.wallet-balance{
  min-width:190px;
  padding:15px;
  border-radius:15px;
  background:#f4f8ff;
  border:1px solid #dce8f7;
}

.wallet-balance span{
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
}

.wallet-balance strong{
  display:block;
  font-size:26px;
  margin-top:4px;
}

.bank-transfer{
  margin-top:18px;
  padding:18px;
  border-radius:15px;
  background:#fafcff;
  border:1px solid var(--line);
}

.bank-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:13px 0;
}

.bank-grid>div{
  padding:12px;
  border-radius:11px;
  background:#fff;
  border:1px solid var(--line);
}

.bank-grid span{
  display:block;
  font-size:9px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:5px;
}

.bank-grid strong{
  font-size:11px;
}

.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #cfd8e5;
  border-radius:13px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(4,16,32,.68);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:50;
}

.modal-box{
  background:#fff;
  border-radius:22px;
  width:min(530px,100%);
  padding:27px;
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  border:0;
  background:transparent;
  font-size:28px;
  color:var(--muted);
}

.qr-holder{
  display:flex;
  justify-content:center;
  padding:18px;
}

.qr-holder img,
.qr-holder canvas{
  border-radius:8px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:#10233f;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  z-index:80;
  font-weight:800;
  font-size:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.footer{
  padding:35px 0 45px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

.footer strong{
  color:var(--navy);
}

.role-tabs{
  display:flex;
  background:#edf3fa;
  border-radius:15px;
  padding:5px;
  margin:0 0 20px;
}

.role-tab{
  flex:1;
  border:0;
  background:transparent;
  padding:12px;
  border-radius:11px;
  color:#59708c;
  font-weight:850;
}

.role-tab.active{
  background:var(--navy);
  color:#fff;
}

.how{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.how-item{
  padding:20px;
  border-radius:17px;
  background:#f9fbff;
  border:1px solid var(--line);
}

.how-num{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:950;
  margin-bottom:12px;
}

.pitch-banner{
  margin:20px 0;
  padding:23px;
  border-radius:20px;
  background:linear-gradient(
    100deg,
    #0a2d59,
    #155fb9
  );
  color:#fff;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.pitch-banner p{
  color:#d7e7fb;
  margin:6px 0 0;
  font-size:12px;
}

.camera-status{
  padding:15px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.camera-status strong{
  display:block;
  color:var(--navy);
  margin-bottom:5px;
}

@media(max-width:950px){

  .hero{
    grid-template-columns:1fr;
    padding:44px 32px;
  }

  .hero-visual{
    min-height:280px;
  }

  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .feature-row{
    grid-template-columns:repeat(2,1fr);
  }

  .feature-strip{
    grid-template-columns:repeat(2,1fr);
  }

  .feature-step:nth-child(2){
    border-right:0;
  }

  .feature-step:nth-child(-n+2){
    border-bottom:1px solid var(--line);
  }

  .grid.two{
    grid-template-columns:1fr;
  }

  .scanner{
    grid-template-columns:1fr;
  }
}

@media(max-width:620px){

  .top{
    height:68px;
  }

  .brand-name{
    font-size:17px;
  }

  .brand-mark{
    width:38px;
    height:38px;
  }

  .role-pill{
    display:none;
  }

  .hero{
    margin-top:16px;
    padding:34px 23px;
    border-radius:22px;
  }

  .hero h1{
    font-size:43px;
  }

  .hero-visual{
    min-height:230px;
  }

  .bus{
    left:10px;
    transform:scale(.78);
    transform-origin:left bottom;
  }

  .qr-card{
    right:0;
    transform:scale(.8) rotate(4deg);
  }

  .coin{
    right:20px;

/* =========================================================
   CAMERA / QR SCANNER LIFECYCLE
   ========================================================= */

/*
  This version returns a Promise so that another scanner
  can wait until the previous camera is properly released.
*/

function stopScanner(){

  const reader=
    window.__qrReader;

  window.__qrReader=null;

  if(!reader){

    return Promise.resolve();

  }

  return Promise.resolve()
    .then(
      ()=>reader.stop()
    )
    .catch(
      ()=>{}
    )
    .then(
      ()=>{
        try{

          return Promise.resolve(
            reader.clear()
          ).catch(
            ()=>{}
          );

        }catch(e){

          return Promise.resolve();

        }
      }
    );

}


/*
  Dynamically load an external JavaScript library.
*/

function loadScript(
  src,
  globalName
){

  if(window[globalName]){

    return Promise.resolve(
      window[globalName]
    );

  }

  if(
    window.__scriptPromises?.[globalName]
  ){

    return window.__scriptPromises[
      globalName
    ];

  }

  window.__scriptPromises=
    window.__scriptPromises||{};

  window.__scriptPromises[
    globalName
  ]=
    new Promise(
      (resolve,reject)=>{

        const existing=
          document.querySelector(
            'script[data-lib="'+
            globalName+
            '"]'
          );

        if(existing){

          existing.addEventListener(
            "load",
            ()=>{
              if(window[globalName]){
                resolve(
                  window[globalName]
                );
              }else{
                reject(
                  new Error(
                    "Library global missing"
                  )
                );
              }
            }
          );

          existing.addEventListener(
            "error",
            reject
          );

          return;
        }

        const s=
          document.createElement(
            "script"
          );

        s.src=src;
        s.async=true;
        s.dataset.lib=globalName;

        s.onload=()=>{

          if(window[globalName]){

            resolve(
              window[globalName]
            );

          }else{

            reject(
              new Error(
                "Library loaded but global was missing"
              )
            );

          }

        };

        s.onerror=reject;

        document.head.appendChild(s);

      }
    );

  return window.__scriptPromises[
    globalName
  ];

}

/* =========================================================

   ========================================================= */

function createAccount(e){

  e.preventDefault();

  const f=e.target;

  const checked=
    f.querySelector(
      'input[name="role"]:checked'
    );

  if(!checked){

    return toast(
      "Choose an account type."
    );

  }

  const r=checked.value;

  const d=db();

  const email=
    f.querySelector(
      "#email"
    )
    .value
    .trim()
    .toLowerCase();


  if(
    d.users.some(
      u=>u.email===email
    )
  ){

    return toast(
      "An account with that email already exists."
    );

  }


  if(
    r==="admin" &&
    f.querySelector(
      "#adminCode"
    )?.value!=="FUTA-ADMIN"
  ){

    return toast(
      "Invalid admin access code."
    );

  }


  const school=
    f.querySelector(
      "#school"
    )?.value||"FUTA";


  const u={

    id:r[0]+Date.now(),

    name:
      f.querySelector(
        "#name"
      ).value.trim(),

    email,

    password:
      f.querySelector(
        "#password"
      ).value,

    role:r,

    school,

    status:
      r==="driver"
      ?
      "pending"
      :
      "approved",

    demoBalance:
      r==="student"
      ?
      2000
      :
      r==="driver"
      ?
      4850
      :
      0,

    credit:0

  };


  d.users.push(u);

  save(d);

  setSession(u.id);

  toast(
    r==="driver"
    ?
    "Account created — waiting for FUTA admin approval."
    :
    "Account created."
  );

  render();

}

/* =========================================================
   IMPORTANT:
   STUDENT "SCAN QR" ACTION
   NOW AUTOMATICALLY STARTS CAMERA
   ========================================================= */

function studentAction(type){

  /*
    Request the old scanner to stop.
  */

  const stopPromise=
    stopScanner();


  const u=session();

  if(!u){
    return;
  }


  const host=
    document.getElementById(
      "studentAction"
    );

  if(!host){
    return;
  }


  /* -----------------------------------------
     SCAN QR
     ----------------------------------------- */

  if(type==="scan"){

    window.__selectedDriver="";

    /*
      Render scanner.
    */

    host.innerHTML=
      studentScan(u);


    /*
      Automatically start the camera
      after the scanner DOM exists.
    */

    setTimeout(
      ()=>{
        stopPromise
          .then(
            ()=>startScanner()
          )
          .catch(
            ()=>startScanner()
          );
      },
      100
    );


    /*
      Scroll scanner into view.
    */

    setTimeout(
      ()=>{
        host.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });
      },
      120
    );


    return;

  }


  /* -----------------------------------------
     REQUEST CHANGE
     ----------------------------------------- */

  if(type==="change"){

    host.innerHTML=
      studentChange(
        u,
        window.__selectedDriver||""
      );

    setTimeout(
      updatePreview,
      20
    );

    return;

  }


  /* -----------------------------------------
     USE CREDIT
     ----------------------------------------- */

  if(type==="useCredit"){

    host.innerHTML=
      studentUseCredit(u);

    return;

  }


  /* -----------------------------------------
     WALLET
     ----------------------------------------- */

  if(type==="wallet"){

    host.innerHTML=
      studentWallet(u);

    return;

  }


  /* -----------------------------------------
     ISSUE
     ----------------------------------------- */

  if(type==="issue"){

    host.innerHTML=
      studentIssue(u);

  }

}

/* =========================================================
   REAL CAMERA SCANNER
   ========================================================= */

async function startScanner(){

  const readerEl=
    document.getElementById(
      "reader"
    );


  if(!readerEl){

    toast(
      "Scanner area not found."
    );

    return;

  }


  /*
    Don't start two scanners at the same time.
  */

  if(window.__startingScanner){

    return;

  }


  if(window.__qrReader){

    toast(
      "Camera scanner is already running."
    );

    return;

  }


  window.__startingScanner=true;


  /* =======================================================
     CHECK HTTPS / SECURE CONTEXT
     ======================================================= */

  if(
    !window.isSecureContext &&
    ![
      "localhost",
      "127.0.0.1"
    ].includes(location.hostname)
  ){

    window.__startingScanner=false;


    readerEl.innerHTML=`

      <div
        class="camera-status"
        style="padding:30px"
      >

        <strong>
          Camera requires HTTPS
        </strong>

        Open the SHUTLER app through
        your Vercel HTTPS link.

        <br><br>

        Camera scanning will work on
        the deployed Vercel version.

        <br><br>

        <button
          class="btn blue"
          onclick="startScanner()"
        >
          Try camera again
        </button>

      </div>

    `;


    toast(
      "Camera scanning requires HTTPS."
    );

    return;

  }


  /* =======================================================
     CHECK CAMERA API
     ======================================================= */

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    window.__startingScanner=false;


    readerEl.innerHTML=`

      <div
        class="camera-status"
        style="padding:30px"
      >

        <strong>
          Camera API unavailable
        </strong>

        This browser does not provide
        the camera access required by SHUTLER.

        <br><br>

        Please use Chrome or Edge
        on the deployed HTTPS site.

      </div>

    `;


    toast(
      "Camera API is unavailable."
    );

    return;

  }


  /* =======================================================
     LOAD QR SCANNER LIBRARY
     ======================================================= */

  readerEl.innerHTML=`

    <div
      class="camera-status"
      style="padding:30px"
    >

      <strong>
        Starting camera…
      </strong>

      Your browser may ask for
      camera permission.

    </div>

  `;


  try{

    const Html5QrcodeClass=
      await ensureScannerLib();


    /*
      The scanner element may have been changed
      while the library was loading.
    */

    const currentReader=
      document.getElementById(
        "reader"
      );

    if(!currentReader){

      window.__startingScanner=false;

      return;

    }


    /*
      Make sure we are starting fresh.
    */

    await stopScanner();


    currentReader.innerHTML="";


    /*
      Create scanner instance.
    */

    const reader=
      new Html5QrcodeClass(
        "reader"
      );


    window.__qrReader=
      reader;


    /*
      Scanner configuration.
    */

    const config={

      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    };


    let scanLocked=false;


    /* =====================================================
       HANDLE SUCCESSFUL QR SCAN
       ===================================================== */

    const handleScan=
      async(decodedText)=>{

        if(scanLocked){

          return;

        }

        scanLocked=true;


        try{

          /*
            Decode the QR payload.
          */

          const payload=
            JSON.parse(
              decodedText
            );


          /*
            Read current database.
          */

          const d=db();


          /*
            Verify that this QR actually belongs
            to an approved SHUTLER driver.
          */

          const dr=
            d.users.find(
              u=>
                u.id===payload.driverId &&
                u.role==="driver" &&
                u.school===payload.school &&
                u.status==="approved"
            );


          if(!dr){

            scanLocked=false;

            toast(
              "QR is not an approved SHUTLER driver."
            );

            return;

          }


          /*
            Driver successfully identified.
          */

          window.__selectedDriver=
            dr.id;


          /*
            Stop camera after successful scan.
          */

          try{

            await reader.stop();

          }catch(e){}


          try{

            await reader.clear();

          }catch(e){}


          window.__qrReader=
            null;


          /*
            Update UI.
          */

          const el=
            document.getElementById(
              "selectedDriver"
            );


          if(el){

            el.innerHTML=`

              <b>
                ✓ Driver identified
              </b>

              <div
                style="
                  margin-top:8px;
                  font-size:15px;
                  font-weight:900;
                "
              >
                ${esc(dr.name)}
              </div>

              <div
                class="small muted"
                style="margin-top:5px"
              >
                ${esc(dr.school)}
                · Approved SHUTLER driver
              </div>


              <button
                class="btn green"
                style="
                  margin-top:12px;
                  width:100%;
                "
                onclick="
                  studentAction('change')
                "
              >
                Continue to request change →
              </button>

            `;

          }


          toast(
            "Driver QR verified successfully."
          );


        }catch(error){

          /*
            QR may belong to another format.
            Keep scanner running.
          */

          scanLocked=false;

          toast(
            "That QR is not a valid SHUTLER driver QR."
          );

        }

      };


    /* =====================================================
       FIND AVAILABLE CAMERAS
       ===================================================== */

    let cameras=[];


    try{

      cameras=
        await Html5QrcodeClass.getCameras();

    }catch(cameraError){

      cameras=[];

    }


    /* =====================================================
       CAMERA FOUND
       ===================================================== */

    if(
      cameras &&
      cameras.length>0
    ){

      /*
        Prefer a rear/environment camera
        when a device exposes one.

        On a laptop, there is normally
        only one webcam, so cameras[0]
        will be selected.
      */

      let selectedCamera=
        cameras.find(
          camera=>
            /back|rear|environment/i.test(
              camera.label||""
            )
        );


      if(!selectedCamera){

        selectedCamera=
          cameras[0];

      }


      await reader.start(

        selectedCamera.id,

        config,

        handleScan,

        ()=>{}

      );


      window.__startingScanner=
        false;


      toast(
        "Camera is live. Point it at the driver's QR."
      );


      return;

    }


    /* =====================================================
       FALLBACK CAMERA CONSTRAINT
       ===================================================== */

    await reader.start(

      {
        facingMode:"environment"
      },

      config,

      handleScan,

      ()=>{}

    );


    window.__startingScanner=
      false;


    toast(
      "Camera is live. Point it at the driver's QR."
    );


  }catch(err){

    console.error(
      "SHUTLER camera error:",
      err
    );


    window.__qrReader=
      null;

    window.__startingScanner=
      false;


    readerEl.innerHTML=`

      <div
        class="camera-status"
        style="padding:30px"
      >

        <strong>
          Camera could not be opened
        </strong>

        Make sure you:

        <br><br>

        • Open SHUTLER using your Vercel
        HTTPS link.

        <br>

        • Allow camera permission when
        Chrome or Edge asks.

        <br>

        • Make sure another application
        is not currently using the webcam.

        <br><br>

        <button
          class="btn blue"
          onclick="startScanner()"
        >
          Try camera again
        </button>


        <button
          class="btn outline"
          style="margin-top:8px"
          onclick="demoScan()"
        >
          Use demo scan
        </button>

      </div>

    `;


    toast(
      "Camera access was unavailable."
    );

  }

}

/* =========================================================
   CLAIM SUBMISSION
   ========================================================= */

function submitClaim(e){

  e.preventDefault();

  const u=session();

  const driver=
    document.getElementById(
      "claimDriver"
    ).value;

  const fare=
    Number(
      document.getElementById(
        "fare"
      ).value
    );

  const paid=
    Number(
      document.getElementById(
        "paid"
      ).value
    );

  const amount=
    paid-fare;


  if(!driver){

    return toast(
      "Select an approved driver."
    );

  }


  if(
    !Number.isFinite(fare) ||
    !Number.isFinite(paid) ||
    amount<=0
  ){

    return toast(
      "Amount paid must be greater than the fare."
    );

  }


  const d=db();


  const dr=
    d.users.find(
      x=>
        x.id===driver &&
        x.role==="driver" &&
        x.school===u.school &&
        x.status==="approved"
    );


  if(!dr){

    return toast(
      "That driver is not approved."
    );

  }


  const id=
    "c"+Date.now();


  d.claims.push({

    id,

    studentId:u.id,

    driverId:driver,

    amount,

    fare,

    paid,

    status:"pending",

    createdAt:
      new Date().toISOString()

  });


  d.transactions.push({

    id:
      "t"+Date.now(),

    userId:u.id,

    type:"claim",

    amount,

    title:"Change claim",

    detail:
      `Awaiting ${dr.name}'s confirmation · ${timeNow()}`,

    status:"pending",

    claimId:id

  });


  save(d);

  window.__selectedDriver=
    driver;

  toast(
    `${money(amount)} change claim sent to ${dr.name}.`
  );

  render();

}

/* =========================================================
   USE CREDIT
   ========================================================= */

function useCredit(e){

  e.preventDefault();

  const u=session();

  const d=db();

  const live=
    d.users.find(
      x=>x.id===u.id
    );

  const driver=
    document.getElementById(
      "useDriver"
    ).value;

  const amount=
    Number(
      document.getElementById(
        "useAmount"
      ).value
    );


  if(!driver){

    return toast(
      "Select an approved driver."
    );

  }


  if(
    !amount ||
    amount<=0
  ){

    return toast(
      "Enter a valid ride amount."
    );

  }


  if(
    amount>
    Number(live.credit||0)
  ){

    return toast(
      "That ride costs more than your available credit."
    );

  }


  const dr=
    d.users.find(
      x=>
        x.id===driver &&
        x.role==="driver" &&
        x.status==="approved"
    );


  if(!dr){

    return toast(
      "Driver is not approved."
    );

  }


  live.credit-=
    amount;


  d.transactions.push({

    id:
      "t"+Date.now(),

    userId:live.id,

    type:"fare",

    amount:-amount,

    title:"Ride paid with change credit",

    detail:
      `${dr.name} · ${timeNow()}`,

    status:"confirmed"

  });


  save(d);

  toast(
    `${money(amount)} of your change credit was applied.`
  );

  render();

}

/* =========================================================
   DRIVER DECISION
   ========================================================= */

function driverDecision(
  id,
  status
){

  const d=db();

  const u=session();

  const c=
    d.claims.find(
      x=>x.id===id
    );


  if(
    !c ||
    c.driverId!==u.id ||
    c.status!=="pending"
  ){

    return toast(
      "This claim has already been processed."
    );

  }


  c.status=
    status;


  const st=
    d.users.find(
      x=>x.id===c.studentId
    );


  const tx=
    d.transactions.find(
      t=>t.claimId===c.id
    );


  if(
    status==="confirmed" &&
    st
  ){

    st.credit=
      Number(st.credit||0)+
      Number(c.amount);


    if(tx){

      tx.status=
        "confirmed";

      tx.title=
        "Change credit received";

      tx.detail=
        `Driver confirmed · ${timeNow()}`;

    }else{

      d.transactions.push({

        id:
          "t"+Date.now(),

        userId:st.id,

        type:"credit",

        amount:c.amount,

        title:"Change credit received",

        detail:
          `Driver confirmed · ${timeNow()}`,

        status:"confirmed",

        claimId:c.id

      });

    }

  }else if(tx){

    tx.status=
      "rejected";

    tx.title=
      "Change claim rejected";

    tx.detail=
      `Driver rejected · ${timeNow()}`;

  }


  save(d);

  toast(
    status==="confirmed"
    ?
    "Claim confirmed — student credit updated."
    :
    "Claim rejected."
  );

  render();

}

   ========================================================= */

function resolveIssue(id){

  const d=db();

  const u=session();

  const i=
    d.issues.find(
      x=>x.id===id
    );


  if(!i){

    return;

  }


  const st=
    d.users.find(
      x=>x.id===i.studentId
    );


  if(
    !st ||
    st.school!==u.school

  }


  i.status=
    "resolved";


  save(d);

  toast(
    "Issue resolved."

  render();

}


/* =========================================================

   ========================================================= */

async function openQR(id){

  const d=db();


  const u=
    d.users.find(
      x=>
        x.id===id &&
        x.role==="driver" &&
        x.status==="approved"
    );


  if(!u){

    return toast(
      "Approved driver not found."
    );

  }


  const modal=
    document.getElementById(
      "modal"
    );


  modal.innerHTML=`

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>


      <div class="eyebrow">
        DRIVER QR
      </div>


      <h2>
        ${esc(u.name)}
      </h2>


      <p class="muted">
        ${esc(u.school)}
        · Approved SHUTLER driver
      </p>


      <div
        id="qr"
        class="qr-holder"
      >

        <div class="muted small">
          Generating driver QR…
        </div>

      </div>


      <div
        class="notice centered"
        style="margin-top:10px"
      >

        <b>
          Presentation tip:
        </b>

        Keep this QR visible on the phone
        while the student scans it with
        the laptop webcam.

      </div>


      <p class="small muted centered">

        The QR contains only the SHUTLER
        driver identifier and school.

      </p>

    </div>

  `;


  modal.classList.remove(
    "hidden"
  );


  try{

    const QRCodeClass=
      await ensureQRLib();


    const qr=
      document.getElementById(
        "qr"
      );


    if(!qr){

      return;

    }


    qr.innerHTML="";


    /*
      IMPORTANT:
      This is the exact data that the
      student scanner expects.
    */

    const payload=
      JSON.stringify({

        app:APP_NAME,

        version:1,

        driverId:u.id,

        school:u.school

      });


    new QRCodeClass(

      qr,

      {

        text:payload,

        width:260,

        height:260,

        colorDark:"#08264d",

        colorLight:"#ffffff",

        correctLevel:
          QRCodeClass.CorrectLevel.M

      }

    );


  }catch(e){

    const qr=
      document.getElementById(
        "qr"
      );


    if(qr){

      qr.innerHTML=`

        <div class="danger-note">

          QR generator could not load.

          <br><br>

          Check your internet connection
          and reopen the QR.

        </div>

      `;

    }


    toast(
      "QR generator could not load."
    );

  }

}
