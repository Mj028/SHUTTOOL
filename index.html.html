<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08264d">
<title>SHUTLER — Campus Change Credit</title>
<style>
:root{--navy:#08264d;--blue:#1769ff;--green:#13a05a;--red:#d64545;--bg:#f5f8fc;--card:#fff;--text:#10233f;--muted:#6b7b91;--line:#dfe7f1;--shadow:0 15px 40px rgba(15,39,70,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{width:min(1160px,92%);margin:auto}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:20}.brand{border:0;background:transparent;display:flex;align-items:center;gap:10px;color:var(--navy)}.brand-mark{width:40px}.brand-name{font-weight:950;letter-spacing:.08em;font-size:20px}.brand-tag{display:block;font-size:9px;color:var(--muted);font-weight:800}.top-actions{display:flex;align-items:center;gap:9px}.role-pill{padding:8px 12px;border-radius:999px;background:#eef4fb;font-size:12px;font-weight:850}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--navy);color:#fff}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--text)}.soft{background:#edf4ff;color:#1551b4}.red{background:#fff0f0;color:var(--red)}.hero{margin:28px 0 22px;border-radius:28px;background:radial-gradient(circle at 85% 15%,#2a80e8,#124c91 32%,#071f3d 75%);color:#fff;min-height:430px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:55px 50px;box-shadow:0 24px 60px rgba(6,31,61,.18)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:950;color:#5c91dc}.hero .eyebrow{color:#a8d0ff}.hero h1{font-size:clamp(42px,6vw,72px);line-height:.92;letter-spacing:-.04em;margin:12px 0 18px}.hero h1 span{color:#77b0ff}.hero p{max-width:650px;color:#dbe9fa;line-height:1.7}.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:25px}.scene{height:290px;position:relative}.bus{position:absolute;left:20px;bottom:35px;width:330px;height:140px;border-radius:28px 35px 20px 20px;background:linear-gradient(#eaf4ff 0 35%,#1680ed 36% 72%,#0c4c9b 73%);border:4px solid rgba(255,255,255,.3)}.bus:before{content:"";position:absolute;left:22px;top:16px;width:282px;height:50px;border-radius:15px;background:#173653}.bus:after{content:"SHUTLER";position:absolute;left:45px;top:29px;color:#fff;font-size:13px;font-weight:950;letter-spacing:.18em}.wheel{position:absolute;bottom:-24px;width:52px;height:52px;border-radius:50%;background:#15253a;border:9px solid #fff}.wheel.a{left:52px}.wheel.b{right:48px}.coin{position:absolute;right:25px;top:30px;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#0a984f;border:7px solid #fff;color:#fff;font-size:32px;font-weight:950}.qr-card{position:absolute;right:0;bottom:10px;width:140px;height:165px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 24px 50px rgba(0,0,0,.25);transform:rotate(4deg);color:var(--navy)}.fake-qr{height:105px;border:5px solid #111;border-radius:8px;background:repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 8px)}.qr-label{font-size:9px;font-weight:900;text-align:center;margin-top:8px}.strip{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:7px;margin-bottom:25px}.strip>div{padding:18px;display:flex;gap:11px;border-right:1px solid var(--line)}.strip>div:last-child{border:0}.icon{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-weight:950}.strip strong{display:block;font-size:13px}.strip span{display:block;font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.card{padding:23px;margin:16px 0}.card h2,.card h3{margin:0 0 7px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:28px 0 18px}.page-head h2{font-size:31px;margin:5px 0}.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:18px}.stat label{display:block;font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase}.stat strong{display:block;font-size:27px;margin-top:8px}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.feature{padding:18px;border:1px solid var(--line);background:#fff;border-radius:17px;text-align:left;min-height:120px}.feature strong{display:block}.feature span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.two{grid-template-columns:1.1fr .9fr}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.row-title{font-weight:850}.row-sub{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;text-transform:uppercase}.pending{background:#fff6df;color:#d99012}.approved,.confirmed,.resolved{background:#e9f9f0;color:#0d7e45}.rejected,.open{background:#fff0f0;color:#d64545}.green-text{color:#0d7e45}.red-text{color:#d64545}.auth-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:45px 0}.auth{width:min(510px,100%)}form{display:grid;gap:13px}label{font-size:12px;font-weight:850}input,select,textarea{width:100%;border:1px solid #cbd6e3;border-radius:12px;padding:12px;background:#fff;outline:0;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:#6d9fec;box-shadow:0 0 0 3px #e8f1ff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.role{border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer}.role.selected{border:2px solid var(--blue);background:#f1f6ff}.role input{display:none}.role strong{display:block}.role span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.helper,.notice,.danger{padding:13px;border-radius:12px;font-size:11px;line-height:1.55}.helper{background:#f7f9fc;border:1px dashed #cbd5e1;color:var(--muted)}.notice{background:#eef5ff;color:#214e90}.danger{background:#fff0f0;color:#8d3030}.scanner{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.reader{min-height:370px;border:1px dashed #b7c5d8;border-radius:18px;background:#f9fbfe;overflow:hidden;display:grid;place-items:center}.reader>div{max-width:100%}.driver-box{border:1px solid #cfe7d8;background:#f6fff9;border-radius:15px;padding:17px}.pay-box{border:1px solid #cfe0f7;background:#f8fbff;border-radius:16px;padding:18px}.pay-total{font-size:38px;font-weight:950;margin:7px 0}.wallet-head{display:flex;justify-content:space-between;gap:20px}.wallet{min-width:190px;padding:15px;border-radius:15px;background:#f4f8ff;border:1px solid #dce8f7}.wallet span{display:block;font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase}.wallet strong{display:block;font-size:26px;margin-top:4px}.bank{margin-top:18px;padding:18px;border-radius:15px;background:#fafcff;border:1px solid var(--line)}.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}.bank-grid div{padding:12px;border-radius:11px;background:#fff;border:1px solid var(--line)}.bank-grid span{display:block;font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase;margin-bottom:5px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cfd8e5;border-radius:13px}.modal{position:fixed;inset:0;background:rgba(4,16,32,.68);display:grid;place-items:center;padding:20px;z-index:50}.modal-box{background:#fff;border-radius:22px;width:min(530px,100%);padding:27px;position:relative}.close{position:absolute;right:14px;top:8px;border:0;background:transparent;font-size:28px;color:var(--muted)}.qr-holder{display:flex;justify-content:center;padding:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10233f;color:#fff;padding:12px 18px;border-radius:12px;z-index:80;font-weight:800;font-size:12px}.footer{padding:35px 0 45px;text-align:center;color:var(--muted);font-size:11px}.banner{margin:20px 0;padding:22px;border-radius:20px;background:linear-gradient(100deg,#0a2d59,#155fb9);color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center}.banner p{color:#d7e7fb;margin:6px 0 0;font-size:12px}
@media(max-width:950px){.hero{grid-template-columns:1fr}.stats,.features,.strip{grid-template-columns:repeat(2,1fr)}.strip>div:nth-child(2){border-right:0}.two,.scanner{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.top{height:66px}.brand-name{font-size:17px}.role-pill{display:none}.hero{padding:34px 22px}.hero h1{font-size:43px}.stats,.features,.strip,.roles,.form-grid,.bank-grid,.grid{grid-template-columns:1fr}.strip>div{border-right:0;border-bottom:1px solid var(--line)}.strip>div:last-child{border-bottom:0}.page-head,.wallet-head{flex-direction:column}.wallet{width:100%}.row{align-items:flex-start;flex-direction:column}.auth{padding:20px}.bus{transform:scale(.78);transform-origin:left bottom}.qr-card{transform:scale(.78) rotate(4deg)}.coin{transform:scale(.8)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"></div>
<script>
const DB_KEY="shutler_demo_db_v7",SESSION_KEY="shutler_demo_session_v7",APP_NAME="SHUTLER";
const seed={users:[{id:"admin1",name:"FUTA Transport Admin",email:"admin@futa.shutler.demo",password:"admin123",role:"admin",school:"FUTA",status:"approved"},{id:"stu1",name:"Joseph",email:"student@shutler.demo",password:"student123",role:"student",school:"FUTA",status:"approved",demoBalance:2000,credit:300},{id:"drv1",name:"Adewale",email:"driver@shutler.demo",password:"driver123",role:"driver",school:"FUTA",status:"approved",demoBalance:4850},{id:"drv2",name:"Emeka",email:"pending.driver@shutler.demo",password:"driver123",role:"driver",school:"FUTA",status:"pending",demoBalance:0}],claims:[{id:"c1",studentId:"stu1",driverId:"drv1",amount:300,fare:200,paid:500,status:"confirmed"}],transactions:[{id:"t1",userId:"stu1",type:"credit",amount:300,title:"Change credit received",detail:"Driver confirmed",status:"confirmed",claimId:"c1"},{id:"t2",userId:"stu1",type:"fare",amount:-200,title:"Ride payment",detail:"Approved shuttle",status:"confirmed"}],issues:[],settings:{fare:200}};
function clone(x){return JSON.parse(JSON.stringify(x))}function db(){let r=localStorage.getItem(DB_KEY);if(!r){localStorage.setItem(DB_KEY,JSON.stringify(seed));return clone(seed)}try{return JSON.parse(r)}catch(e){localStorage.setItem(DB_KEY,JSON.stringify(seed));return clone(seed)}}function save(x){localStorage.setItem(DB_KEY,JSON.stringify(x))}function user(){const id=localStorage.getItem(SESSION_KEY);return id?db().users.find(x=>x.id===id)||null:null}function setSession(id){localStorage.setItem(SESSION_KEY,id)}function esc(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]))}function money(n){return "₦"+Number(n||0).toLocaleString("en-NG")}function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add("hidden"),2600)}
function stopScanner(){if(window.__scanner){try{window.__scanner.stop().then(()=>window.__scanner.clear()).catch(()=>{})}catch(e){}window.__scanner=null}}
function lib(src,name){if(window[name])return Promise.resolve(window[name]);window.__libs=window.__libs||{};if(window.__libs[name])return window.__libs[name];window.__libs[name]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>window[name]?res(window[name]):rej();s.onerror=rej;document.head.appendChild(s)});return window.__libs[name]}
function logo(){return `<svg class="brand-mark" viewBox="0 0 64 64"><rect x="8" y="18" width="42" height="29" rx="8" fill="#1769ff"/><rect x="14" y="24" width="17" height="10" rx="2.5" fill="#dff0ff"/><rect x="34" y="24" width="10" height="10" rx="2.5" fill="#dff0ff"/><circle cx="18" cy="49" r="6" fill="#08264d"/><circle cx="43" cy="49" r="6" fill="#08264d"/><circle cx="49" cy="16" r="11" fill="#13a05a" stroke="#fff" stroke-width="3"/><path d="M49 10v12M45 13h6M45 19h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`}
function header(u){return `<header class="top"><button class="brand" onclick="render()">${logo()}<span><span class="brand-name">SHUTLER</span><span class="brand-tag">TAP · SCAN · PAY · GET YOUR CHANGE</span></span></button>${u?`<div class="top-actions"><span class="role-pill">${esc(u.school)} · ${esc(u.role)}</span><span class="avatar">${esc((u.name||"U")[0].toUpperCase())}</span><button class="btn outline" onclick="logout()">Sign out</button></div>`:""}</header>`}
function landing(){return `${header()}<main class="shell"><section class="hero"><div><div class="eyebrow">Campus change credit</div><h1>Less hassle.<br><span>More rides.</span><br>Real change.</h1><p>SHUTLER connects students and approved campus shuttle drivers so a cash payment and its change can be recorded, confirmed and carried forward.</p><div class="hero-actions"><button class="btn blue" onclick="showAuth('signup')">Create account →</button><button class="btn outline" onclick="showAuth('login')">Sign in</button></div></div><div><div class="scene"><div class="bus"><div class="wheel a"></div><div class="wheel b"></div></div><div class="coin">₦</div><div class="qr-card"><div class="fake-qr"></div><div class="qr-label">SCAN · PAY · CLAIM</div></div></div></div></section><section class="strip"><div><div class="icon">⌗</div><div><strong>Scan driver QR</strong><span>Identify the approved driver.</span></div></div><div><div class="icon">₦</div><div><strong>Pay here</strong><span>Enter fare and amount paid.</span></div></div><div><div class="icon">✓</div><div><strong>Confirm</strong><span>Driver verifies the change.</span></div></div><div><div class="icon">↗</div><div><strong>Carry credit</strong><span>Use confirmed change later.</span></div></div></section><div class="banner"><div><strong>A simple accountability layer for campus shuttle change.</strong><p>Cash remains the payment method while SHUTLER records the amount owed.</p></div><button class="btn green" onclick="showAuth('signup')">Start</button></div><section class="card"><div class="eyebrow">How it works</div><h2>Scan. Pay. Record the change.</h2><div class="grid"><div class="card"><b>1. Scan</b><p class="small muted">Scan the driver's unique SHUTLER QR.</p></div><div class="card"><b>2. Pay here</b><p class="small muted">Enter the fare and amount paid.</p></div><div class="card"><b>3. Confirm</b><p class="small muted">The driver confirms the change claim.</p></div></div></section><div class="footer"><strong>SHUTLER</strong> · Campus transport</div></main>`}
function showAuth(mode){stopScanner();document.getElementById("app").innerHTML=auth(mode)}
function auth(mode){return `${header()}<main class="shell auth-wrap"><div class="card auth"><div class="eyebrow">SHUTLER · FUTA</div><h2>${mode==="signup"?"Create account":"Welcome back"}</h2><p class="muted">${mode==="signup"?"Choose your role and enter your details.":"Sign in to continue."}</p>${mode==="signup"?signup():login()}<div style="margin-top:15px;text-align:center"><button class="btn outline" onclick="showAuth('${mode==="signup"?"login":"signup"}')">${mode==="signup"?"Already have an account? Sign in":"Need an account? Create one"}</button></div></div></main>`}
function signup(){return `<form onsubmit="createAccount(event)"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Account type</label><div class="roles">${[["student","Student","Manage rides and change credit"],["driver","Driver","Confirm student change"],["admin","Admin","Manage transport"]].map((x,i)=>`<label class="role ${i===0?"selected":""}"><input type="radio" name="role" value="${x[0]}" ${i===0?"checked":""} onchange="refreshRole()"><strong>${x[1]}</strong><span>${x[2]}</span></label>`).join("")}</div><div id="roleFields">${roleFields("student")}</div><button class="btn primary" type="submit">Create account →</button></form>`}
function roleFields(r){if(r==="driver")return `<label>School<select id="school"><option>FUTA</option></select></label><div class="notice">Driver accounts wait for FUTA admin approval.</div>`;if(r==="admin")return `<label>School<select id="school"><option>FUTA</option></select></label><label>Admin access code<input id="adminCode" placeholder="FUTA-ADMIN"></label>`;return `<label>School<select id="school"><option>FUTA</option></select></label>`}
function refreshRole(){const r=document.querySelector('input[name="role"]:checked')?.value||"student";document.getElementById("roleFields").innerHTML=roleFields(r);document.querySelectorAll(".role").forEach(x=>x.classList.remove("selected"));document.querySelector('input[value="'+r+'"]').parentElement.classList.add("selected")}
function login(){return `<form onsubmit="doLogin(event)"><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button class="btn primary" type="submit">Sign in →</button><div class="helper"><b>Demo accounts</b><br>Student: student@shutler.demo / student123<br>Driver: driver@shutler.demo / driver123<br>Admin: admin@futa.shutler.demo / admin123</div></form>`}
function createAccount(e){e.preventDefault();const f=e.target,r=f.querySelector('input[name="role"]:checked').value,d=db(),email=f.querySelector("#email").value.trim().toLowerCase();if(d.users.some(x=>x.email===email))return toast("That email is already registered.");if(r==="admin"&&f.querySelector("#adminCode")?.value!=="FUTA-ADMIN")return toast("Invalid admin access code.");const u={id:r[0]+Date.now(),name:f.querySelector("#name").value.trim(),email,password:f.querySelector("#password").value,role:r,school:f.querySelector("#school")?.value||"FUTA",status:r==="driver"?"pending":"approved",demoBalance:r==="student"?2000:r==="driver"?4850:0,credit:0};d.users.push(u);save(d);setSession(u.id);toast(r==="driver"?"Account created. Awaiting approval.":"Account created.");render()}
function doLogin(e){e.preventDefault();const d=db(),u=d.users.find(x=>x.email===document.getElementById("loginEmail").value.trim().toLowerCase()&&x.password===document.getElementById("loginPassword").value);if(!u)return toast("Invalid email or password.");setSession(u.id);render()}function logout(){stopScanner();localStorage.removeItem(SESSION_KEY);render()}function resetDemo(){stopScanner();localStorage.setItem(DB_KEY,JSON.stringify(seed));localStorage.removeItem(SESSION_KEY);render();toast("Demo reset.")}
function nav(r){return `<div class="small muted" style="margin-top:18px">SHUTLER · ${r} workspace</div>`}
function student(u){const d=db(),claims=d.claims.filter(x=>x.studentId===u.id).reverse(),tx=d.transactions.filter(x=>x.userId===u.id).reverse();return `${header(u)}<main class="shell">${nav("student")}<div class="page-head"><div><div class="eyebrow">Student dashboard</div><h2>Good afternoon, ${esc(u.name)}.</h2><p class="muted">Scan the driver, pay for the ride and record any change owed.</p></div><button class="btn blue" onclick="studentAction('scan')">Scan QR →</button></div><div class="stats"><div class="stat"><label>Change credit</label><strong class="green-text">${money(u.credit)}</strong></div><div class="stat"><label>Wallet balance</label><strong>${money(u.demoBalance)}</strong></div><div class="stat"><label>Pending claims</label><strong>${claims.filter(x=>x.status==="pending").length}</strong></div><div class="stat"><label>Total claims</label><strong>${claims.length}</strong></div></div><div class="features"><button class="feature" onclick="studentAction('scan')"><div class="icon">⌗</div><strong>Scan QR</strong><span>Use this computer camera to scan the driver's phone.</span></button><button class="feature" onclick="studentAction('wallet')"><div class="icon">+</div><strong>Fund wallet</strong><span>Simulate adding transport funds.</span></button><button class="feature" onclick="studentAction('credit')"><div class="icon">↗</div><strong>Use credit</strong><span>Apply confirmed change to a ride.</span></button><button class="feature" onclick="studentAction('issue')"><div class="icon">!</div><strong>Report issue</strong><span>Send a transaction issue to admin.</span></button></div><div id="studentAction">${scanView()}</div><div class="grid two"><div class="card" style="background:linear-gradient(135deg,#08264d,#155fb9);color:#fff;border:0"><div class="eyebrow" style="color:#9dcbff">Confirmed change credit</div><h3>Carry your credit forward</h3><div style="font-size:42px;font-weight:950;margin:7px 0">${money(u.credit)}</div><div style="color:#d3e5fa">Available for a future approved ride.</div></div><div class="card"><div class="eyebrow">Recent activity</div><h3>Transactions</h3><div class="list">${tx.slice(0,5).map(transactionRow).join("")||'<div class="empty">No transactions yet.</div>'}</div></div></div><div class="card"><div class="eyebrow">Claims</div><h3>My change claims</h3><div class="list">${claims.map(c=>claimRow(c,d)).join("")||'<div class="empty">No change claims yet.</div>'}</div></div><div class="footer"><strong>SHUTLER</strong> · Your change, made visible.</div></main>`}
function transactionRow(t){return `<div class="row"><div><div class="row-title">${esc(t.title)}</div><div class="row-sub">${esc(t.detail||"")}</div></div><strong class="${Number(t.amount)>=0?"green-text":"red-text"}">${Number(t.amount)>=0?"+":""}${money(t.amount)}</strong></div>`}
function claimRow(c,d){const dr=d.users.find(x=>x.id===c.driverId);return `<div class="row"><div><div class="row-title">${money(c.amount)} change · ${esc(dr?.name||"Driver")}</div><div class="row-sub">Fare ${money(c.fare)} · Paid ${money(c.paid)}</div></div><span class="badge ${c.status}">${c.status}</span></div>`}
function scanView(){return `<div class="card"><div class="eyebrow">Pay a driver</div><h3>Scan the driver's SHUTLER QR</h3><p class="muted">Point this computer camera at the driver's QR. After the driver is verified, the fare set by the transport admin appears automatically.</p><div class="scanner"><div class="reader" id="reader"><div class="small muted center">Press Scan QR to open the camera.</div></div><div><div id="scanResult" class="driver-box"><b>No driver scanned</b><div class="small muted" style="margin-top:5px">Driver details and payment options will appear here after scanning.</div></div><button class="btn blue" style="width:100%;margin-top:10px" onclick="startScanner()">Start camera</button><button class="btn outline" style="width:100%;margin-top:8px" onclick="demoScan()">Use demo driver</button></div></div></div>`}
function studentAction(type){stopScanner();const h=document.getElementById("studentAction"),u=user();if(!h)return;if(type==="scan"){h.innerHTML=scanView();setTimeout(startScanner,150);return}if(type==="wallet"){h.innerHTML=walletView(u);return}if(type==="credit"){h.innerHTML=creditView(u);return}if(type==="issue"){h.innerHTML=issueView(u)}}
async function startScanner(){const el=document.getElementById("reader");if(!el)return;if(!window.isSecureContext&&!['localhost','127.0.0.1'].includes(location.hostname)){el.innerHTML='<div class="danger center">Camera access requires HTTPS. Open the Vercel site.</div>';return toast("Open the HTTPS Vercel site to scan.")}el.innerHTML='<div class="small muted center">Opening camera…</div>';try{const H=await lib("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js","Html5Qrcode");stopScanner();el.innerHTML="";const r=new H("reader");window.__scanner=r;await r.start({facingMode:"environment"},{fps:10,qrbox:250,aspectRatio:1},handleScan,()=>{})}catch(e){try{const H=window.Html5Qrcode;if(!H)throw e;const cams=await H.getCameras();if(!cams.length)throw e;stopScanner();el.innerHTML="";const r=new H("reader");window.__scanner=r;await r.start(cams[0].id,{fps:10,qrbox:250},handleScan,()=>{})}catch(err){window.__scanner=null;el.innerHTML='<div class="danger center">Camera could not be opened. Check browser permission and make sure this is the HTTPS Vercel site.</div>';toast("Camera access was unavailable.")}}}
function handleScan(text){try{const p=JSON.parse(text),d=db(),dr=d.users.find(x=>x.id===p.driverId&&x.role==="driver"&&x.school===p.school&&x.status==="approved");if(!dr)throw 0;stopScanner();window.__selectedDriver=dr.id;showDriver(dr)}catch(e){toast("This is not a valid approved SHUTLER driver QR.")}}
function demoScan(){const d=db(),dr=d.users.find(x=>x.id==="drv1"&&x.status==="approved");if(!dr)return;stopScanner();window.__selectedDriver=dr.id;showDriver(dr)}
function showDriver(dr){const el=document.getElementById("scanResult"),fare=Number(db().settings?.fare||200);if(el)el.innerHTML=`<b>Driver identified</b><h3 style="margin:6px 0">${esc(dr.name)}</h3><div class="small muted">${esc(dr.school)} · Approved driver</div><div class="pay-box" style="margin-top:12px"><div class="small muted">Transport fare set by admin</div><div class="pay-total">${money(fare)}</div><button class="btn green" style="width:100%" onclick="payExact()">Pay ${money(fare)} here</button><button class="btn outline" style="width:100%;margin-top:8px" onclick="requestChangeView()">Request for change</button></div>`;toast("Driver verified. Fare loaded.")}
function paymentView(){requestChangeView()}
function payExact(){const u=user(),d=db(),dr=d.users.find(x=>x.id===window.__selectedDriver&&x.role==="driver"&&x.status==="approved"),fare=Number(d.settings?.fare||200);if(!dr)return toast("Scan a driver first.");d.transactions.push({id:"t"+Date.now(),userId:u.id,type:"fare",amount:-fare,title:"Transport payment",detail:`Paid ${money(fare)} to ${dr.name}`,status:"confirmed"});save(d);toast(`${money(fare)} payment recorded.`);render()}
function requestChangeView(){const h=document.getElementById("studentAction"),d=db(),dr=d.users.find(x=>x.id===window.__selectedDriver&&x.role==="driver"&&x.status==="approved"),fare=Number(d.settings?.fare||200);if(!dr)return toast("Scan a driver first.");h.innerHTML=`<div class="card"><div class="eyebrow">Request for change</div><h3>Pay cash and record the change owed</h3><p class="muted">${esc(dr.name)} · ${esc(dr.school)} · Fare fixed by transport admin</p><div class="pay-box"><div class="wallet" style="min-width:0;margin-bottom:13px"><span>Transport fare</span><strong>${money(fare)}</strong></div><label>Amount of cash paid<input id="changePaid" type="number" min="${fare}" value="500" oninput="calcRequestedChange()"></label><div id="requestedChange" class="notice" style="margin-top:13px">Change to receive: <b>${money(500-fare)}</b></div><button class="btn green" style="width:100%;margin-top:13px" onclick="completePayment()">Record payment & request ${money(500-fare)} change →</button></div></div>`;calcRequestedChange()}
function calcRequestedChange(){const d=db(),fare=Number(d.settings?.fare||200),paid=Number(document.getElementById("changePaid")?.value||0),x=document.getElementById("requestedChange");if(x)x.innerHTML=`Change to receive: <b>${money(Math.max(0,paid-fare))}</b>`}
function calcChange(){calcRequestedChange()}
function completePayment(){const u=user(),d=db(),dr=d.users.find(x=>x.id===window.__selectedDriver&&x.role==="driver"&&x.status==="approved"),fare=Number(d.settings?.fare||200),paid=Number(document.getElementById("changePaid")?.value||0),change=paid-fare;if(!dr)return toast("Driver not found.");if(!Number.isFinite(paid)||paid<fare)return toast(`Cash paid must be at least ${money(fare)}.`);if(change<=0)return payExact();const now=Date.now(),cid="c"+now;d.claims.push({id:cid,studentId:u.id,driverId:dr.id,amount:change,fare,paid,status:"pending"});d.transactions.push({id:"t"+now,userId:u.id,type:"fare",amount:-fare,title:"Transport payment",detail:`Paid ${money(paid)} cash to ${dr.name}`,status:"confirmed"});d.transactions.push({id:"t"+(now+1),userId:u.id,type:"claim",amount:change,title:"Change requested",detail:`${money(change)} awaiting ${dr.name}'s confirmation`,status:"pending",claimId:cid});save(d);toast(`${money(change)} change request sent to ${dr.name}.`);render()}
function walletView(u){return `<div class="card"><div class="eyebrow">Demo wallet</div><div class="wallet-head"><div><h3>Fund your SHUTLER wallet</h3><p class="muted">Simulated funding for the demonstration.</p></div><div class="wallet"><span>Current balance</span><strong>${money(u.demoBalance)}</strong></div></div><div class="bank"><strong>Bank transfer simulation</strong><div class="bank-grid"><div><span>Bank</span><strong>SHUTLER Demo Bank</strong></div><div><span>Account name</span><strong>${esc(u.name)}</strong></div><div><span>Account number</span><strong>0123456789</strong></div></div><button class="btn green" onclick="fundDemo()">Add ₦1,000 demo funds</button></div></div>`}
function fundDemo(){const u=user(),d=db(),x=d.users.find(a=>a.id===u.id);x.demoBalance=Number(x.demoBalance||0)+1000;d.transactions.push({id:"t"+Date.now(),userId:x.id,type:"funding",amount:1000,title:"Wallet funding",detail:"Demo bank transfer",status:"confirmed"});save(d);toast("₦1,000 added.");render()}
function creditView(u){const d=db(),drivers=d.users.filter(x=>x.role==="driver"&&x.school===u.school&&x.status==="approved");return `<div class="card"><div class="eyebrow">Use confirmed credit</div><h3>Apply change credit to a ride</h3><div class="wallet" style="margin:12px 0"><span>Available credit</span><strong>${money(u.credit)}</strong></div><form onsubmit="useCredit(event)"><label>Driver<select id="creditDriver"><option value="">Select driver</option>${drivers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><label>Ride amount<input id="creditAmount" type="number" min="1" required></label><button class="btn green" type="submit" ${u.credit<=0?"disabled":""}>Apply credit →</button></form></div>`}
function useCredit(e){e.preventDefault();const u=user(),d=db(),x=d.users.find(a=>a.id===u.id),amount=Number(document.getElementById("creditAmount").value),dr=d.users.find(a=>a.id===document.getElementById("creditDriver").value);if(!dr)return toast("Select a driver.");if(amount<=0||amount>x.credit)return toast("Enter an amount within your available credit.");x.credit-=amount;d.transactions.push({id:"t"+Date.now(),userId:x.id,type:"fare",amount:-amount,title:"Ride paid with change credit",detail:dr.name,status:"confirmed"});save(d);toast("Credit applied.");render()}
function issueView(){return `<div class="card"><div class="eyebrow">Support</div><h3>Report a transaction issue</h3><form onsubmit="submitIssue(event)"><label>What happened?<textarea id="issueText" rows="4" required></textarea></label><button class="btn primary">Send to transport admin →</button></form></div>`}
function submitIssue(e){e.preventDefault();const u=user(),d=db(),text=document.getElementById("issueText").value.trim();if(!text)return;d.issues.push({id:"i"+Date.now(),studentId:u.id,title:"Student transaction issue",text,status:"open"});save(d);toast("Issue sent.");render()}
function driver(u){const d=db(),claims=d.claims.filter(x=>x.driverId===u.id).reverse();return `${header(u)}<main class="shell">${nav("driver")}<div class="page-head"><div><div class="eyebrow">Driver dashboard</div><h2>Welcome, ${esc(u.name)}.</h2><p class="muted">Show your QR to the student. After the student pays, verify the change claim.</p></div><button class="btn blue" onclick="openQR('${u.id}')">Show my QR →</button></div><div class="stats"><div class="stat"><label>Account balance</label><strong>${money(u.demoBalance)}</strong></div><div class="stat"><label>School</label><strong style="font-size:22px">${esc(u.school)}</strong></div><div class="stat"><label>Pending claims</label><strong>${claims.filter(x=>x.status==="pending").length}</strong></div><div class="stat"><label>Total claims</label><strong>${claims.length}</strong></div></div><div class="card"><div class="eyebrow">Driver QR</div><h3>Your unique SHUTLER QR</h3><p class="muted">Open this QR on your phone and let the student's computer camera scan it.</p><button class="btn soft" onclick="openQR('${u.id}')">Open QR code</button></div><div class="card"><div class="eyebrow">Change verification</div><h3>Claims from students</h3><div class="list">${claims.map(c=>{const st=d.users.find(x=>x.id===c.studentId);return `<div class="row"><div><div class="row-title">${money(c.amount)} change · ${esc(st?.name||"Student")}</div><div class="row-sub">Fare ${money(c.fare)} · Paid ${money(c.paid)}</div></div><div class="actions"><span class="badge ${c.status}">${c.status}</span>${c.status==="pending"?`<button class="btn green" onclick="driverDecision('${c.id}','confirmed')">Confirm</button><button class="btn red" onclick="driverDecision('${c.id}','rejected')">Reject</button>`:""}</div></div>`}).join("")||'<div class="empty">No change claims yet.</div>'}</div></div><div class="footer"><strong>SHUTLER</strong> · Driver verification</div></main>`}
function driverDecision(id,status){const d=db(),u=user(),c=d.claims.find(x=>x.id===id);if(!c||c.driverId!==u.id||c.status!=="pending")return toast("Claim already processed.");c.status=status;const st=d.users.find(x=>x.id===c.studentId),tx=d.transactions.find(x=>x.claimId===c.id);if(status==="confirmed"&&st){st.credit=Number(st.credit||0)+Number(c.amount);if(tx){tx.status="confirmed";tx.title="Change credit received";tx.detail=`Confirmed by ${u.name}`}else d.transactions.push({id:"t"+Date.now(),userId:st.id,type:"credit",amount:c.amount,title:"Change credit received",detail:`Confirmed by ${u.name}`,status:"confirmed",claimId:c.id})}else if(tx){tx.status="rejected";tx.title="Change claim rejected";tx.detail=`Rejected by ${u.name}`}save(d);toast(status==="confirmed"?"Change confirmed.":"Claim rejected.");render()}
function pendingDriver(u){return `${header(u)}<main class="shell"><div class="card center" style="max-width:680px;margin:70px auto;padding:40px"><span class="badge pending">Waiting for approval</span><h2>Driver account submitted</h2><p class="muted">Your FUTA driver account is waiting for transport admin approval.</p><button class="btn outline" onclick="logout()">Back to sign in</button></div></main>`}
function admin(u){const d=db(),drivers=d.users.filter(x=>x.role==="driver"&&x.school===u.school),issues=d.issues.filter(i=>d.users.find(x=>x.id===i.studentId)?.school===u.school).reverse();return `${header(u)}<main class="shell">${nav("admin")}<div class="page-head"><div><div class="eyebrow">Transport office · ${esc(u.school)}</div><h2>Admin control centre</h2><p class="muted">Approve drivers and resolve student transaction issues.</p></div><button class="btn outline" onclick="resetDemo()">Reset demo</button></div><div class="stats"><div class="stat"><label>Registered drivers</label><strong>${drivers.length}</strong></div><div class="stat"><label>Pending approvals</label><strong>${drivers.filter(x=>x.status==="pending").length}</strong></div><div class="stat"><label>Open issues</label><strong>${issues.filter(x=>x.status==="open").length}</strong></div><div class="stat"><label>Status</label><strong style="font-size:21px;color:#13a05a">Live</strong></div></div><div class="card"><div class="eyebrow">Transport settings</div><h3>Set campus shuttle fare</h3><p class="muted">This fare is shown to students immediately after they scan an approved driver.</p><form onsubmit="saveFare(event)"><div class="form-grid"><label>Current fare (₦)<input id="adminFare" type="number" min="1" value="${Number(d.settings?.fare||200)}" required></label><div class="notice">Students can either pay the exact fare or request change after paying a higher cash amount.</div></div><button class="btn blue" type="submit">Save transport fare</button></form></div><div class="grid two"><div class="card"><div class="eyebrow">Driver management</div><h3>Approval queue</h3><div class="list">${drivers.map(x=>`<div class="row"><div><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(x.email)} · ${esc(x.school)}</div></div><div class="actions"><span class="badge ${x.status}">${x.status}</span>${x.status==="pending"?`<button class="btn green" onclick="adminDecision('${x.id}','approved')">Approve</button><button class="btn red" onclick="adminDecision('${x.id}','rejected')">Reject</button>`:""}</div></div>`).join("")}</div></div><div class="card"><div class="eyebrow">Student support</div><h3>Transaction issues</h3><div class="list">${issues.map(i=>{const st=d.users.find(x=>x.id===i.studentId);return `<div class="row"><div><div class="row-title">${esc(i.title)}</div><div class="row-sub">${esc(st?.name||"Student")} · ${esc(i.text)}</div></div><div class="actions"><span class="badge ${i.status}">${i.status}</span>${i.status==="open"?`<button class="btn green" onclick="resolveIssue('${i.id}')">Resolve</button>`:""}</div></div>`}).join("")||'<div class="empty">No issues reported.</div>'}</div></div></div></main>`}
function saveFare(e){e.preventDefault();const d=db(),amount=Number(document.getElementById("adminFare").value);if(!Number.isFinite(amount)||amount<=0)return toast("Enter a valid fare.");d.settings=d.settings||{};d.settings.fare=amount;save(d);toast(`Transport fare set to ${money(amount)}.`);render()}
function adminDecision(id,status){const d=db(),u=user(),x=d.users.find(a=>a.id===id&&a.role==="driver"&&a.school===u.school);if(!x)return;x.status=status;save(d);toast(`Driver ${status}.`);render()}function resolveIssue(id){const d=db(),i=d.issues.find(x=>x.id===id);if(!i)return;i.status="resolved";save(d);toast("Issue resolved.");render()}
async function openQR(id){const d=db(),u=d.users.find(x=>x.id===id&&x.role==="driver"&&x.status==="approved");if(!u)return toast("Driver not approved.");const m=document.getElementById("modal");m.innerHTML=`<div class="modal-box"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">DRIVER QR</div><h2>${esc(u.name)}</h2><p class="muted">${esc(u.school)} · Approved driver</p><div id="qr" class="qr-holder"></div><p class="small muted center">Keep this QR open on the driver's phone. Scan it using the student's computer camera.</p></div>`;m.classList.remove("hidden");try{const Q=await lib("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","QRCode");new Q(document.getElementById("qr"),{text:JSON.stringify({app:APP_NAME,version:3,driverId:u.id,school:u.school}),width:250,height:250,colorDark:"#08264d",colorLight:"#fff",correctLevel:Q.CorrectLevel.M})}catch(e){document.getElementById("qr").innerHTML='<div class="danger center">QR generator could not load. Check internet connection.</div>'}}
function closeModal(){stopScanner();const m=document.getElementById("modal");m.classList.add("hidden");m.innerHTML=""}
function render(){stopScanner();const u=user();document.getElementById("app").innerHTML=u?(u.role==="student"?student(u):u.role==="driver"?(u.status==="approved"?driver(u):pendingDriver(u)):admin(u)):landing()}
window.showAuth=showAuth;window.refreshRole=refreshRole;window.createAccount=createAccount;window.doLogin=doLogin;window.logout=logout;window.resetDemo=resetDemo;window.studentAction=studentAction;window.startScanner=startScanner;window.demoScan=demoScan;window.paymentView=paymentView;window.requestChangeView=requestChangeView;window.payExact=payExact;window.calcRequestedChange=calcRequestedChange;window.calcChange=calcChange;window.completePayment=completePayment;window.saveFare=saveFare;window.fundDemo=fundDemo;window.useCredit=useCredit;window.submitIssue=submitIssue;window.driverDecision=driverDecision;window.adminDecision=adminDecision;window.resolveIssue=resolveIssue;window.openQR=openQR;window.closeModal=closeModal;render();
</script>
</body>
</html>
